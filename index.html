    * {

    /* BACKGROUND ANIMATION */
    .bg {

    .bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.85));
    }

    @keyframes bgZoom {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    /* EFEK KILATAN PETIR (LIGHTNING FLASH) */
    .lightning-flash {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.85);
      pointer-events: none;
      z-index: -3;
      opacity: 0;
    }

    .flash-active {
      animation: lightningAnimation 0.35s ease-out;
    }

    @keyframes lightningAnimation {
      0% { opacity: 0; }
      10% { opacity: 0.75; }
      15% { opacity: 0.1; }
      25% { opacity: 0.9; }
      40% { opacity: 0.15; }
      100% { opacity: 0; }
    }

    #lightningCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: -3;
    }

    .crow-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -4;
      overflow: hidden;
    }

    .raven {
      position: absolute;
      bottom: -60px;
      width: 40px;
      height: 30px;
      animation: flyUp linear infinite;
      filter: drop-shadow(0 0 6px rgba(0, 0, 0, 0.9));
    }

    .raven .wing {
      position: absolute;
      width: 22px;
      height: 12px;
      background: #08080a;
      border-radius: 80% 20% 10% 10%;
      top: 8px;
    }

    .raven .wing.left {
      left: 0;
      transform-origin: right center;
      animation: flapLeft 0.35s ease-in-out infinite alternate;
    }

    .raven .wing.right {
      right: 0;
      transform-origin: left center;
      animation: flapRight 0.35s ease-in-out infinite alternate;
    }

    .raven .body {
      position: absolute;
      left: 17px;
      top: 6px;
      width: 6px;
      height: 18px;
      background: #111116;
      border-radius: 50%;
    }

    .raven .head {
      position: absolute;
      left: 18px;
      top: 1px;
      width: 4px;
      height: 6px;
      background: #000;
      border-radius: 50%;
    }

    .raven .beak {
      position: absolute;
      left: 19px;
      top: -2px;
      width: 2px;
      height: 4px;
      background: #222;
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    }

    .raven .tail {
      position: absolute;
      left: 18px;
      top: 22px;
      width: 4px;
      height: 10px;
      background: #08080a;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }

    @keyframes flapLeft {
      0%   { transform: rotate(0deg) scaleY(1); }
      100% { transform: rotate(55deg) scaleY(0.6); }
    }

    @keyframes flapRight {
      0%   { transform: rotate(0deg) scaleY(1); }
      100% { transform: rotate(-55deg) scaleY(0.6); }
    }

    @keyframes flyUp {
      0% { transform: translateY(0) translateX(0) scale(0.6); opacity: 0; }
      10% { opacity: 0.9; }
      50% { transform: translateY(-60vh) translateX(30px) scale(0.9); }
      90% { opacity: 0.8; }
      100% { transform: translateY(-115vh) translateX(-20px) scale(1.2); opacity: 0; }
    }

    .feather {
      position: absolute;
      top: -30px;
      width: 8px;
      height: 22px;
      background: linear-gradient(180deg, #2a2a30, #050508);
      border-radius: 80% 0 80% 0;
      opacity: 0.8;
      box-shadow: 0 0 3px rgba(0,0,0,0.8);
      animation: fallFeather linear infinite;
    }

    @keyframes fallFeather {
      0% { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0; }
      15% { opacity: 0.85; }
      50% { transform: translateY(50vh) rotate(180deg) translateX(40px); }

    // SISTEM PENGAMANAN PEMBUKAAN TAB MOBILE (SUPAYA TIDAK DIBLOKIR BROWSER HP)
    function safeOpen(url) {
      // Metode 1: Menggunakan jendela baru standar
      let win = window.open(url, '_blank');
      
      // Metode 2: Jika diblokir, buat elemen anchor instan yang mensimulasikan klik user sentuh
      if (!win || win.closed || typeof win == 'undefined') {
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.target = '_blank';
        anchor.rel = 'noopener noreferrer';
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
    }

    function openBulkLinks() {
      const text = document.getElementById("bulkLinks").value;
      const delayInput = parseFloat(document.getElementById("delayInput").value);
      const delay = (isNaN(delayInput) || delayInput < 0.3 ? 0.8 : delayInput) * 1000;
      
      if (!text || text.trim() === "") {
        alert("Silakan tempel atau masukkan link terlebih dahulu!");
        return;
      }

      const rawLines = text.split(/[\n,\s]+/);
      const validUrls = [];

      rawLines.forEach(function(line) {
        var url = line.trim();
        if (url.length > 0) {
          if (!url.match(/^https?:\/\//i)) {
            url = "https://" + url;
          }
          validUrls.push(url);
        }
      });

      if (validUrls.length === 0) {
        alert("Tidak ada link valid untuk dibuka.");
        return;
      }

      // Link pertama dibuka langsung tanpa setTimeout untuk mengamankan gesture user di HP
      safeOpen(validUrls[0]);

      // Sisa link dibuka dengan jeda waktu terkontrol
      for (let i = 1; i < validUrls.length; i++) {
        setTimeout(function() {
          safeOpen(validUrls[i]);
        }, i * delay);
      }
    }

    function createCrow() {
