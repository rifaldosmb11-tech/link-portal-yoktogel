<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOKTOGEL PORTAL</title>

  <!-- FONT HOROR KHUSUS DARI GOOGLE FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Nosifer&display=swap" rel="stylesheet">

  <style>
    /* GLOBAL RESET & BASE STYLES */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #050505;
      color: #ffd700;
      padding: 20px;
      padding-bottom: 60px;
      overflow-x: hidden;
    }

    /* BACKGROUND ANIMATION */
    .bg {
      position: fixed;
      inset: 0;
      background: url('https://cdn.areabermain.club/assets/cdn/az7/2026/08/10/20260810/b2c1200dd34728ecd2fb7891fa9961b8/bc3f48e7-c5dd-444e-909e-6d1815e2622a.png') center center no-repeat;
      background-size: cover;
      animation: bgZoom 20s linear infinite;
      z-index: -5;
    }

    .bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.85));
    }

    @keyframes bgZoom {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    /* EFEK KILATAN PETIR (LIGHTNING FLASH) - TANPA SUARA */
    .lightning-flash {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.85);
      pointer-events: none;
      z-index: -3;
      opacity: 0;
    }

    .flash-active {
      animation: lightningAnimation 0.35s ease-out;
    }

    @keyframes lightningAnimation {
      0% { opacity: 0; }
      10% { opacity: 0.75; }
      15% { opacity: 0.1; }
      25% { opacity: 0.9; }
      40% { opacity: 0.15; }
      100% { opacity: 0; }
    }

    /* CANVAS GARIS PETIR */
    #lightningCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: -3;
    }

    /* CONTAINER ELEMEN RAVEN & FEATHER */
    .crow-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -4;
      overflow: hidden;
    }

    /* ANIMASI SILUET BURUNG GAGAK (FLAPPING WINGS) */
    .raven {
      position: absolute;
      bottom: -60px;
      width: 40px;
      height: 30px;
      animation: flyUp linear infinite;
      filter: drop-shadow(0 0 6px rgba(0, 0, 0, 0.9));
    }

    .raven .wing {
      position: absolute;
      width: 22px;
      height: 12px;
      background: #08080a;
      border-radius: 80% 20% 10% 10%;
      top: 8px;
    }

    .raven .wing.left {
      left: 0;
      transform-origin: right center;
      animation: flapLeft 0.35s ease-in-out infinite alternate;
    }

    .raven .wing.right {
      right: 0;
      transform-origin: left center;
      animation: flapRight 0.35s ease-in-out infinite alternate;
    }

    .raven .body {
      position: absolute;
      left: 17px;
      top: 6px;
      width: 6px;
      height: 18px;
      background: #111116;
      border-radius: 50%;
    }

    .raven .head {
      position: absolute;
      left: 18px;
      top: 1px;
      width: 4px;
      height: 6px;
      background: #000;
      border-radius: 50%;
    }

    .raven .beak {
      position: absolute;
      left: 19px;
      top: -2px;
      width: 2px;
      height: 4px;
      background: #222;
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    }

    .raven .tail {
      position: absolute;
      left: 18px;
      top: 22px;
      width: 4px;
      height: 10px;
      background: #08080a;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }

    @keyframes flapLeft {
      0%   { transform: rotate(0deg) scaleY(1); }
      100% { transform: rotate(55deg) scaleY(0.6); }
    }

    @keyframes flapRight {
      0%   { transform: rotate(0deg) scaleY(1); }
      100% { transform: rotate(-55deg) scaleY(0.6); }
    }

    @keyframes flyUp {
      0% {
        transform: translateY(0) translateX(0) scale(0.6);
        opacity: 0;
      }
      10% {
        opacity: 0.9;
      }
      50% {
        transform: translateY(-60vh) translateX(30px) scale(0.9);
      }
      90% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-115vh) translateX(-20px) scale(1.2);
        opacity: 0;
      }
    }

    /* ANIMASI BULU GAGAK JATUH (FALLING FEATHERS) */
    .feather {
      position: absolute;
      top: -30px;
      width: 8px;
      height: 22px;
      background: linear-gradient(180deg, #2a2a30, #050508);
      border-radius: 80% 0 80% 0;
      opacity: 0.8;
      box-shadow: 0 0 3px rgba(0,0,0,0.8);
      animation: fallFeather linear infinite;
    }

    @keyframes fallFeather {
      0% {
        transform: translateY(0) rotate(0deg) translateX(0);
        opacity: 0;
      }
      15% {
        opacity: 0.85;
      }
      50% {
        transform: translateY(50vh) rotate(180deg) translateX(40px);
      }
      85% {
        opacity: 0.7;
      }
      100% {
        transform: translateY(105vh) rotate(360deg) translateX(-30px);
        opacity: 0;
      }
    }

    /* WRAPPER PANEL AUTO OPENER LINK MODERN PREMIUM */
    .left-panel-wrapper {
      position: fixed;
      top: 50px;
      left: 15px;
      width: 260px;
      border-radius: 20px;
      padding: 2px;
      z-index: 999;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 
                  0 0 20px rgba(255, 0, 128, 0.4), 
                  0 0 15px rgba(0, 255, 204, 0.3);
      animation: panelFloat 4s ease-in-out infinite alternate;
    }

    @keyframes panelFloat {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }

    /* BORDER PELANGI NEON ROTATING */
    .left-panel-wrapper::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(
        #ff0055, 
        #ff9900, 
        #00ffcc, 
        #0088ff, 
        #ff00ff, 
        #ff0055
      );
      animation: rotateRainbow 3s linear infinite;
    }

    @keyframes rotateRainbow {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .left-panel-floating {
      position: relative;
      width: 100%;
      background: rgba(12, 10, 22, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 18px;
      padding: 14px;
      z-index: 1;
    }

    /* JUDUL DENGAN ANIMASI GLOW & PETIR MENGAMBANG */
    .left-panel-floating h3 {
      font-size: 13px;
      text-align: center;
      color: #fff;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-shadow: 0 0 10px rgba(255, 0, 85, 0.8), 0 0 20px rgba(0, 255, 204, 0.6);
    }

    .lightning-icon {
      display: inline-block;
      animation: pulseLightning 1.2s ease-in-out infinite alternate;
      color: #ffdd00;
      filter: drop-shadow(0 0 6px #ffea00);
    }

    @keyframes pulseLightning {
      0% { transform: scale(1) rotate(-5deg); filter: drop-shadow(0 0 4px #ffea00); }
      100% { transform: scale(1.3) rotate(10deg); filter: drop-shadow(0 0 12px #ff0055); }
    }

    /* TEXTAREA DEEP GLOW */
    .bulk-textarea {
      width: 100%;
      height: 110px;
      background: rgba(5, 5, 10, 0.9);
      border: 1px solid rgba(0, 255, 204, 0.3);
      border-radius: 12px;
      color: #00ffcc;
      padding: 10px;
      font-size: 11px;
      font-family: 'Consolas', monospace;
      resize: none;
      outline: none;
      margin-bottom: 10px;
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.9), 0 0 5px rgba(0, 255, 204, 0.1);
      transition: all 0.3s ease;
    }

    .bulk-textarea:focus {
      border-color: #00ffcc;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.9), 0 0 15px rgba(0, 255, 204, 0.5);
    }

    .bulk-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* JEDA INPUT BOX */
    .delay-input-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #e0e0e0;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.04);
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .delay-input-group input {
      width: 55px;
      padding: 3px 6px;
      background: #000;
      border: 1px solid #ffd700;
      color: #ffd700;
      border-radius: 6px;
      text-align: center;
      font-weight: 900;
      font-size: 11px;
      outline: none;
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
      transition: all 0.3s;
    }

    .delay-input-group input:focus {
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.8);
    }

    /* TOMBOL UTAMA DENGAN EFEK KILAU / SHIMMER */
    .bulk-btn-open {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #ff0055, #ff5500, #ffaa00);
      background-size: 200% 200%;
      border: none;
      border-radius: 10px;
      color: #fff;
      font-weight: 900;
      font-size: 11px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(255, 0, 85, 0.5);
      transition: all 0.3s ease;
      animation: gradientShift 3s ease infinite;
    }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* KILAUAN BERGERAK DI ATAS TOMBOL */
    .bulk-btn-open::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 40%;
      height: 200%;
      background: rgba(255, 255, 255, 0.4);
      transform: rotate(30deg);
      animation: shimmer 2.5s infinite;
    }

    @keyframes shimmer {
      0% { left: -60%; }
      100% { left: 140%; }
    }

    .bulk-btn-open:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 6px 20px rgba(255, 0, 85, 0.8), 0 0 15px rgba(255, 221, 0, 0.6);
    }

    .bulk-btn-clear {
      width: 100%;
      padding: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: #aaa;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .bulk-btn-clear:hover {
      background: rgba(255, 0, 85, 0.25);
      border-color: #ff0055;
      color: #fff;
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
    }

    /* HEADER HOROR BERDARAH & ESTETIK */
    .header {
      margin-top: 60px;
      text-align: center;
      font-family: 'Nosifer', 'Creepster', cursive;
      font-size: clamp(28px, 5vw, 52px);
      font-weight: 900;
      letter-spacing: 4px;
      position: relative;
      
      /* Gradient Merah Darah, Ungu Gelap & Emas */
      background: linear-gradient(180deg, #ffffff 0%, #ff1a1a 35%, #8b0000 70%, #d4af37 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      
      animation: 
        bloodShift 4s ease infinite,
        floatHeader 3s ease-in-out infinite alternate,
        scaryBloodGlow 2.5s ease-in-out infinite alternate;
    }

    @keyframes bloodShift {
      0%   { background-position: 0% 0%; }
      50%  { background-position: 0% 100%; }
      100% { background-position: 0% 0%; }
    }

    @keyframes floatHeader {
      0%   { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-6px) scale(1.02); }
    }

    @keyframes scaryBloodGlow {
      0% {
        filter: drop-shadow(0 0 8px rgba(139, 0, 0, 0.9)) 
                drop-shadow(0 0 15px rgba(255, 0, 0, 0.7)) 
                drop-shadow(0 6px 4px #000);
      }
      50% {
        filter: drop-shadow(0 0 20px rgba(255, 0, 50, 1)) 
                drop-shadow(0 0 35px rgba(139, 0, 0, 0.9)) 
                drop-shadow(0 0 45px rgba(212, 175, 55, 0.6));
      }
      100% {
        filter: drop-shadow(0 0 12px rgba(186, 12, 47, 0.9)) 
                drop-shadow(0 0 25px rgba(255, 0, 0, 0.8)) 
                drop-shadow(0 6px 8px #000);
      }
    }

    /* RUNNING TEXT */
    .running {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 8px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      z-index: 9999;
    }

    .running span {
      display: inline-block;
      white-space: nowrap;
      padding-left: 100%;
      animation: run 15s linear infinite;
      font-weight: bold;
    }

    @keyframes run {
      from { transform: translateX(0); }
      to   { transform: translateX(-100%); }
    }

    /* GLASS CARD INFO IP */
    .glass {
      margin: 20px auto;
      padding: 12px 15px;
      max-width: 420px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.4);
      font-size: 14px;
      line-height: 1.6;
    }

    /* TOMBOL AUTO KLIK GOLD */
    .auto {
      width: 100%;
      max-width: 420px;
      margin: 10px auto;
      display: block;
      padding: 14px;
      border: none;
      border-radius: 15px;
      font-weight: bold;
      cursor: pointer;
      color: #111;
      background: linear-gradient(135deg, #3b2a00, #a67c00, #ffd700, #ffea70);
      position: relative;
      overflow: hidden;
      z-index: 1;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.6), 0 0 30px rgba(255, 215, 0, 0.4);
      animation: pulseGold 2s infinite;
    }

    @keyframes pulseGold {
      0% {
        transform: scale(1);
        box-shadow: 0 0 10px rgba(255,215,0,0.4), 0 0 20px rgba(255,215,0,0.3);
      }
      50% {
        transform: scale(1.03);
        box-shadow: 0 0 25px rgba(255,215,0,0.8), 0 0 60px rgba(255,215,0,0.6), 0 0 90px rgba(255,215,0,0.3);
      }
      100% {
        transform: scale(1);
        box-shadow: 0 0 10px rgba(255,215,0,0.4), 0 0 20px rgba(255,215,0,0.3);
      }
    }

    .auto::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 20px;
      background: rgba(255, 215, 0, 0.6);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: -1;
      animation: radarWave 2.5s infinite;
    }

    @keyframes radarWave {
      0%   { width: 20px; height: 20px; opacity: 0.8; }
      100% { width: 300px; height: 300px; opacity: 0; }
    }

    .auto:hover {
      transform: translateY(-2px);
    }

    /* MENU GRID & RED CRIMSON BUTTONS */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      max-width: 650px;
      margin: 20px auto 15px auto;
      justify-items: center;
    }

    @keyframes elegantRedShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes continuousGlow {
      0% {
        box-shadow: 0 0 10px rgba(186, 12, 47, 0.6), 0 0 20px rgba(139, 0, 0, 0.4), inset 0 0 8px rgba(255, 69, 0, 0.3);
        border-color: #b81414;
      }
      50% {
        box-shadow: 0 0 20px rgba(220, 20, 60, 0.9), 0 0 35px rgba(255, 0, 50, 0.6), inset 0 0 15px rgba(255, 140, 0, 0.5);
        border-color: #ff4d4d;
      }
      100% {
        box-shadow: 0 0 10px rgba(186, 12, 47, 0.6), 0 0 20px rgba(139, 0, 0, 0.4), inset 0 0 8px rgba(255, 69, 0, 0.3);
        border-color: #b81414;
      }
    }

    @keyframes sparkLeftAlways {
      0% { transform: translate(0, 0) scale(0.5); opacity: 0.2; }
      50% { opacity: 1; }
      100% { transform: translate(-14px, -20px) scale(1.1); opacity: 0; }
    }

    @keyframes sparkRightAlways {
      0% { transform: translate(0, 0) scale(0.5); opacity: 0.2; }
      50% { opacity: 1; }
      100% { transform: translate(14px, -20px) scale(1.1); opacity: 0; }
    }

    .quick-btn {
      width: 100%;
      height: 55px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      color: #fff;
      letter-spacing: 0.5px;
      background: linear-gradient(-45deg, #2b0208, #5c0612, #8b0819, #bd0f28, #4a030d);
      background-size: 350% 350%;
      border: 1px solid #b81414;
      position: relative;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      animation: 
        elegantRedShift 4s ease infinite, 
        continuousGlow 2.5s ease-in-out infinite !important;
      text-shadow: 0 0 6px rgba(0, 0, 0, 0.8), 0 0 10px rgba(255, 50, 50, 0.5);
    }

    .quick-btn::before,
    .quick-btn::after {
      content: '';
      position: absolute;
      top: 45%;
      width: 5px;
      height: 5px;
      background: radial-gradient(circle, #fff 10%, #ffaa00 40%, #dc143c 80%);
      border-radius: 50%;
      pointer-events: none;
      box-shadow: 0 0 6px #ff0033;
    }

    .quick-btn::before {
      left: 3px;
      animation: sparkLeftAlways 1.2s infinite ease-in-out;
    }

    .quick-btn::after {
      right: 3px;
      animation: sparkRightAlways 1.2s infinite ease-in-out 0.6s;
    }

    .quick-btn:hover {
      transform: scale(1.08) translateY(-4px);
      border-color: #ffd700;
      box-shadow: 0 0 25px rgba(255, 0, 50, 1), 0 0 50px rgba(255, 215, 0, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.4) !important;
      text-shadow: 0 0 10px #fff, 0 0 20px #ff0000;
    }

    /* GOPATH BUTTON CONTAINER */
    .gopath-center-container {
      max-width: 650px;
      margin: 0 auto 20px auto;
      text-align: center;
    }

    /* TOMBOL GOPATH HIJAU NEON */
    .gopath-animated-btn {
      width: 100%;
      max-width: 420px;
      height: 55px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 900;
      font-size: 16px;
      color: #ffffff;
      letter-spacing: 1px;
      background: linear-gradient(-45deg, #003b15, #007a2f, #00b34a, #00ff66, #005c23);
      background-size: 300% 300%;
      border: 1px solid #00ff88;
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      
      animation: 
        greenShift 3s ease infinite,
        greenGlowPulse 2s ease-in-out infinite alternate,
        greenBounce 2.5s ease-in-out infinite;
        
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.9), 0 0 12px rgba(0, 255, 136, 0.8);
      transition: all 0.3s ease;
    }

    @keyframes greenShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes greenGlowPulse {
      0% {
        box-shadow: 0 0 12px rgba(0, 255, 100, 0.6), 0 0 25px rgba(0, 200, 80, 0.4), inset 0 0 10px rgba(255, 255, 255, 0.3);
        border-color: #00ff88;
      }
      100% {
        box-shadow: 0 0 25px rgba(0, 255, 136, 1), 0 0 50px rgba(0, 255, 255, 0.7), inset 0 0 20px rgba(255, 255, 255, 0.6);
        border-color: #a3ffce;
      }
    }

    @keyframes greenBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-5px) scale(1.02); }
    }

    .gopath-animated-btn:hover {
      transform: scale(1.06) translateY(-4px) !important;
      border-color: #ffffff;
      box-shadow: 0 0 35px rgba(0, 255, 136, 1), 0 0 60px rgba(0, 255, 255, 0.8) !important;
    }

    .footer {
      margin-top: 25px;
      text-align: center;
      opacity: 0.7;
    }

    /* HAK CIPTA POJOK KIRI BAWAH */
    .copyright-label {
      position: fixed;
      bottom: 8px;
      left: 12px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      z-index: 999999;
      pointer-events: none;
      letter-spacing: 0.5px;
      text-shadow: 0 0 5px rgba(0, 0, 0, 0.8);
    }

    /* RESPONSIVE LAYOUT UNTUK HP */
    @media (max-width: 1100px) {
      .left-panel-wrapper {
        position: relative;
        top: 0;
        left: 0;
        width: 100%;
        max-width: 420px;
        margin: 15px auto;
      }
      .header {
        margin-top: 50px;
      }
    }
  </style>
</head>

<body>

  <div class="bg"></div>
  
  <!-- ELEMEN VISUAL PETIR -->
  <div class="lightning-flash" id="lightningFlash"></div>
  <canvas id="lightningCanvas"></canvas>

    function openBulkLinks() {

      const delay = (isNaN(delayInput) || delayInput < 0.1 ? 0.3 : delayInput) * 1000;
      
      if (!text || text.trim() === "") {

      const rawLines = text.split(/[\n,\s]+/);
      const validUrls = [];

      rawLines.forEach(function(line) {
        var url = line.trim();
        if (url.length > 0) {
          if (!url.match(/^https?:\/\//i)) {
            url = "https://" + url;
          }
          validUrls.push(url);
        }
      });

      if (validUrls.length === 0) {
        alert("Tidak ada link valid untuk dibuka.");
        return;
      }

      validUrls.forEach(function(url, index) {
        setTimeout(function() {
          window.open(url, "_blank");

    function createCrow() {

    /* GENERATOR BULU GAGAK JATUH */

    /* VISUALISASI KILATAN DAN GARIS PETIR (RINGAN & TANPA SUARA) */
    const canvas = document.getElementById('lightningCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawBolt(startX, startY, length, angle, branchCapacity) {
      if (branchCapacity <= 0) return;

      ctx.beginPath();
      ctx.moveTo(startX, startY);

      let currentX = startX;
      let currentY = startY;

      for (let i = 0; i < length; i++) {
        currentX += Math.sin(angle) * 8 + (Math.random() - 0.5) * 12;
        currentY += Math.cos(angle) * 8 + (Math.random() - 0.5) * 8;

        ctx.lineTo(currentX, currentY);

        if (Math.random() < 0.08 && branchCapacity > 1) {
          drawBolt(currentX, currentY, Math.floor(length * 0.6), angle + (Math.random() - 0.5) * 0.8, branchCapacity - 1);
        }
      }

      ctx.strokeStyle = "rgba(230, 245, 255, 0.9)";
      ctx.lineWidth = 2;
      ctx.shadowColor = "rgba(0, 255, 255, 0.8)";
      ctx.shadowBlur = 10;
      ctx.stroke();
    }

    function triggerLightning() {
      const flashElem = document.getElementById('lightningFlash');
      
      // Flash layar singkat
      flashElem.classList.remove('flash-active');
      void flashElem.offsetWidth; // Reflow
      flashElem.classList.add('flash-active');

      // Gambar Garis Petir
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const startX = Math.random() * canvas.width;
      drawBolt(startX, 0, Math.floor(canvas.height / 10), 0, 3);

      // Hapus garis petir secara cepat
      setTimeout(() => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }, 350);

      // Interval petir secara acak (ringan di CPU)
      const nextDelay = 6000 + Math.random() * 10000;
      setTimeout(triggerLightning, nextDelay);
    }

    // Memulai petir pertama setelah 3 detik
    setTimeout(triggerLightning, 3000);
