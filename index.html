    async function fetchUserIP() {
      const ipElem = document.getElementById("ip");
      const locElem = document.getElementById("loc");

      try {
        const res = await fetch("https://ipwho.is/");
        const data = await res.json();
        if (data.success) {
          ipElem.innerText = data.ip || "N/A";
          locElem.innerText = `${data.city || 'Unknown'}, ${data.country || 'Unknown'}`;
          return;
        }
      } catch (e) {}

      try {
        const res = await fetch("https://ipapi.co/json/");
        const data = await res.json();
        if (data.ip) {
          ipElem.innerText = data.ip;
          locElem.innerText = `${data.city || 'Unknown'}, ${data.country_name || 'Unknown'}`;
          return;
        }
      } catch (e) {}

      try {
        const res = await fetch("https://api.ipify.org?format=json");
        const data = await res.json();
        if (data.ip) {
          ipElem.innerText = data.ip;
          locElem.innerText = "Protected / Blocked";
          return;
        }
      } catch (e) {}

      ipElem.innerText = "Protected";
      locElem.innerText = "Hidden";
    }

    fetchUserIP();

    /* FIRE PARTICLES GENERATOR */
    function createFireParticle() {
      const fireContainer = document.getElementById("fireContainer");
      if (!fireContainer) return;
      
      const particle = document.createElement("div");
      const fireIcons = ["🔥", "✨", "💥", "•"];
      
      particle.className = "fire-particle";
      particle.innerHTML = fireIcons[Math.floor(Math.random() * fireIcons.length)];
      particle.style.left = Math.random() * window.innerWidth + "px";
      
      const duration = 2 + Math.random() * 4;
      particle.style.animationDuration = duration + "s";
      particle.style.fontSize = (12 + Math.random() * 20) + "px";
      
      fireContainer.appendChild(particle);
      
      setTimeout(() => particle.remove(), duration * 1000);
    }

    setInterval(createFireParticle, 70);
  </script>
